services:
  multiworld:
    # Build only once. Web service uses the same image build
    build:
      context: ..
    # Name image for use in web service
    image: archipelago-base
    # Use locally-built image
    pull_policy: never
    # Launch main process without website hosting (config override).
    # Config files are baked into the image under deploy/ (from the repo COPY
    # in the root Dockerfile) rather than bind-mounted, since Coolify's
    # docker-compose runner does not reliably materialize bind-mount sources
    # from the repo checkout onto the host. They're read from /deploy (a
    # duplicate of deploy/ outside of /app - see the root Dockerfile) rather
    # than the in-image deploy/ under /app, because the app_data volume below
    # permanently shadows /app with whatever was there when it was first
    # created; /deploy always reflects the image actually running.
    # run_multiworld.sh copies .apworld files from deploy/custom_worlds/ into
    # custom_worlds/ (where WebHost.py looks for them), and extracts a TLS
    # cert for room servers from Coolify's acme.json, before launching.
    entrypoint: ["sh", "/deploy/run_multiworld.sh"]
    volumes:
      # Mount application volume
      - app_data:/app
      # Coolify's Traefik proxy cert store, read-only, so rooms can terminate
      # TLS themselves (they bypass the proxy via network_mode: host below).
      - /data/coolify/proxy/acme.json:/acme.json:ro

    # Expose on host network for access to dynamically mapped ports
    network_mode: host

    # No Healthcheck in place yet for multiworld
    healthcheck:
      test: ["NONE"]
  web:
    # Use image build by multiworld service
    image: archipelago-base
    # Use locally-built image
    pull_policy: never
    # Launch gunicorn targeting WebHost application. config.yaml is copied
    # from /deploy into the location WebHost.py expects (cwd/config.yaml),
    # since gunicorn has no equivalent of --config_override. See the note on
    # the multiworld service above for why this reads from /deploy rather
    # than the in-image deploy/ under /app, and for the custom_worlds copy
    # step.
    entrypoint: >
      sh -c "rm -rf config.yaml && cp /deploy/config.yaml config.yaml &&
      mkdir -p custom_worlds &&
      for f in /deploy/custom_worlds/*.apworld; do [ -e \"$$f\" ] && cp -f \"$$f\" custom_worlds/; done;
      gunicorn -c /deploy/gunicorn.conf.py"
    volumes:
      # Mount application volume
      - app_data:/app
    environment:
      # Bind gunicorn on 8000
      - PORT=8000

  nginx:
    # nginx.conf is baked in at build time (see nginx.Dockerfile) rather than
    # bind-mounted, for the same reason as the config files on the other
    # services above.
    build:
      context: .
      dockerfile: nginx.Dockerfile
    volumes:
      # Mount application volume
      - app_data:/app
    expose:
      # Nginx listening internally on port 80 -- Coolify's proxy routes the
      # public domain to this over the internal network, no host bind needed
      - 80
    depends_on:
      - web

volumes:
  # Share application directory amongst multiworld and web services
  # (for access to log files and the like), and nginx (for static files)
  app_data:
